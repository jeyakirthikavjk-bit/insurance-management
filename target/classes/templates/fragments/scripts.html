<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="scripts">
<script>
// ===== MODAL HELPERS =====
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active')); });
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('active'); });
});

// ===== ALERT HELPER =====
function showAlert(message, type = 'success') {
    const container = document.getElementById('alertContainer');
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
    container.appendChild(alert);
    setTimeout(() => alert.remove(), 4000);
}

// ===== API HELPERS =====
async function apiPost(url, data, successMsg, callback) {
    try {
        const res = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
        const json = await res.json();
        if (res.ok) { showAlert(successMsg); document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); if (callback) setTimeout(callback, 800); }
        else { showAlert(json.message || 'Operation failed', 'danger'); }
    } catch (e) { showAlert('Network error: ' + e.message, 'danger'); }
}
async function apiPut(url, data, successMsg, callback) {
    try {
        const res = await fetch(url, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
        const json = await res.json();
        if (res.ok) { showAlert(successMsg); document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); if (callback) setTimeout(callback, 800); }
        else { showAlert(json.message || 'Update failed', 'danger'); }
    } catch (e) { showAlert('Network error: ' + e.message, 'danger'); }
}
async function apiPatch(url, successMsg, callback) {
    try {
        const res = await fetch(url, { method: 'PATCH', headers: {'Content-Type':'application/json'} });
        const json = await res.json();
        if (res.ok) { showAlert(successMsg); document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); if (callback) setTimeout(callback, 800); }
        else { showAlert(json.message || 'Operation failed', 'danger'); }
    } catch (e) { showAlert('Network error: ' + e.message, 'danger'); }
}
async function apiDelete(url, successMsg, callback) {
    try {
        const res = await fetch(url, { method: 'DELETE' });
        if (res.ok) { showAlert(successMsg); if (callback) setTimeout(callback, 800); }
        else { const json = await res.json(); showAlert(json.message || 'Delete failed', 'danger'); }
    } catch (e) { showAlert('Network error: ' + e.message, 'danger'); }
}
</script>
</th:block>
</body>
</html>
