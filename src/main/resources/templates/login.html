<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - InsureSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh;
               background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--secondary) 100%); }
        .login-card { background: white; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px;
                      box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-logo { text-align: center; margin-bottom: 2rem; }
        .login-logo i { font-size: 3rem; color: var(--secondary); }
        .login-logo h2 { color: var(--primary); font-size: 1.5rem; margin-top: 0.5rem; }
        .login-logo p { color: var(--gray); font-size: 0.9rem; }
        .login-form .form-group { margin-bottom: 1.2rem; }
        .login-form input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
                            border-radius: 8px; font-size: 1rem; transition: var(--transition); box-sizing: border-box; }
        .login-form input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(0,168,232,0.15); }
        .login-form label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--dark); font-size: 0.9rem; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); }
        .input-icon input { padding-left: 40px; }
        .login-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--primary), var(--primary-light));
                     color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
                     cursor: pointer; transition: var(--transition); margin-top: 0.5rem; }
        .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .demo-info { background: rgba(0,168,232,0.08); border: 1px solid rgba(0,168,232,0.3);
                     border-radius: 8px; padding: 1rem; margin-top: 1.5rem; font-size: 0.85rem; color: var(--gray); }
        .demo-info strong { color: var(--primary); }
        .error-msg { background: #fee; border: 1px solid #f88; border-radius: 8px; padding: 0.75rem 1rem;
                     margin-bottom: 1rem; color: #c00; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">
        <i class="fas fa-shield-alt"></i>
        <h2>InsureSystem</h2>
        <p>Insurance Policy Management</p>
    </div>

    <!-- Error message (shown when login fails) -->
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>

    <!-- Real server-side form POST -->
    <form class="login-form" th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Username</label>
            <div class="input-icon">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Enter username" value="admin" required/>
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Enter password" value="admin" required/>
            </div>
        </div>
        <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>

    <div class="demo-info">
        <strong><i class="fas fa-info-circle"></i> Demo Credentials</strong><br/>
        Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin</strong>
    </div>
</div>
</body>
</html>
